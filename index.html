<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mol-craft — 무료 분자 조립·응력 분석</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    /* Palette: institutional blue (precise, scientific) + amber accent, from ui-ux-pro-max
       "Analytics Dashboard" recommendation — clean and non-garish for a technical tool. */
    --bg: #f8fafc;
    --panel: #eef2f8;
    --surface: #ffffff;
    --fg: #0f172a;
    --muted-fg: #64748b;
    --border: #dbe3ee;
    --primary: #1e40af;
    --primary-fg: #ffffff;
    --accent: #b45309;
    --success: #15803d;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --panel: #121b2c;
      --surface: #17223a;
      --fg: #e6edf6;
      --muted-fg: #94a3b8;
      --border: #263349;
      --primary: #60a5fa;
      --primary-fg: #0b1220;
      --accent: #f0ad4e;
      --success: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 var(--font-sans);
    background: var(--bg);
    color: var(--fg);
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  header strong {
    font-size: 15px;
    letter-spacing: -0.01em;
    color: var(--primary);
    margin-right: 4px;
  }
  #disclaimer {
    font-size: 11.5px;
    color: var(--muted-fg);
    margin-left: auto;
    max-width: 42ch;
    text-align: right;
  }
  #viewer {
    position: relative;
    min-height: 0;
    background: var(--bg);
  }
  #legend {
    position: absolute;
    left: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted-fg);
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    pointer-events: none;
  }
  #legend .bar {
    width: 72px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, #2166ac, #f7f7f7, #b2182b);
  }
  aside {
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 16px;
  }
  section { margin-bottom: 20px; }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted-fg);
    margin: 0 0 8px;
    font-weight: 600;
  }
  #total { font: 600 22px/1.2 var(--font-mono); }
  .bar { height: 14px; background: var(--primary); border-radius: 2px; }
  #toast {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #fff;
    padding: 7px 16px;
    border-radius: 16px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #warn { color: var(--accent); font-size: 12px; margin-top: 4px; }
  button, select {
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--primary); }
  button:focus-visible, select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
  td { padding: 3px 0; } td:last-child { text-align: right; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 55vh 1fr; }
    aside { border-left: none; border-top: 1px solid var(--border); }
    #disclaimer { max-width: none; text-align: left; margin-left: 0; }
  }
  /* 연구 모드에서만 보이는 요소(항별 분해, 리플레이, 완화 스캔 등)와
     학습 모드 전용 요소를 CSS로만 나눈다 — JS 분기 없이 body[data-mode]로 토글. */
  body[data-mode="learn"] .research-only { display: none; }
  body[data-mode="research"] .learn-only { display: none; }
  #stability {
    position: absolute; top: 16px; left: 16px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 60%;
    font-size: 11px; background: color-mix(in srgb, var(--surface) 85%, transparent);
    border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
    pointer-events: none;
  }
  .chip {
    border-radius: 10px; padding: 2px 7px; white-space: nowrap;
    background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
  }
  .chip.danger { background: color-mix(in srgb, #dc2626 18%, transparent); color: #dc2626; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  label.check { font-size: 12px; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <strong>mol-craft</strong>
  <select id="mode"><option value="learn">학습 모드</option><option value="research">연구 모드</option></select>
  <select id="preset"></select>
  <select id="element" class="learn-only"><option>H</option><option selected>C</option><option>N</option><option>O</option>
    <option>F</option><option>S</option><option>P</option><option>Cl</option><option>Si</option><option>B</option>
    <option>Br</option><option>I</option></select>
  <button id="minimize">구조 최적화</button>
  <button id="scan">이면각 스캔</button>
  <select id="scan-step" title="스캔 각도 간격"><option value="5">5°</option><option value="10" selected>10°</option>
    <option value="15">15°</option><option value="30">30°</option></select>
  <label class="check"><input type="checkbox" id="scan-relax">완화 스캔</label>
  <label class="check"><input type="checkbox" id="grid" checked>그리드</label>
  <button id="export-xyz">XYZ</button>
  <button id="export-mol">MOL</button>
  <button id="export-pdb">PDB</button>
  <button id="share">링크 복사</button>
  <button id="share-short">단축 링크</button>
  <span id="disclaimer">UFF 역장 · 진공 · 정전기항 제외 · 정성 비교용(양자계산 대체 아님)</span>
</header>
<div id="viewer">
  <div id="toast"></div>
  <div id="stability"></div>
  <div id="legend"><span>응력 낮음</span><span class="bar"></span><span>응력 높음</span></div>
</div>
<aside>
  <section><h2>총 에너지</h2><div id="total">—</div><div id="warn"></div></section>
  <section class="research-only"><h2>항별 분해 (kcal/mol)</h2><div id="breakdown"></div></section>
  <section><h2>선택 측정</h2><div id="measure">원자를 2~4개 클릭</div></section>
  <section><h2>이면각 회전</h2>
    <input id="dihedral" type="range" min="-180" max="180" value="0" style="width:100%" disabled>
    <div id="dihedral-info" style="font-size:12px">원자 4개를 순서대로 선택하면 활성화됩니다</div>
  </section>
  <section class="research-only"><h2>최적화 리플레이</h2>
    <input id="replay" type="range" min="0" max="0" value="0" style="width:100%" disabled>
    <div id="replay-info" style="font-size:12px">구조 최적화를 실행하면 활성화됩니다</div>
  </section>
  <section><h2>이면각 스캔</h2><div id="chart">회전 가능한 결합의 원자 4개를 선택하세요</div></section>
  <section><h2>VSEPR 상태</h2><div id="vsepr">—</div></section>
  <section id="gallery-section" hidden><h2>공개 갤러리</h2><div id="gallery">불러오는 중…</div></section>
</aside>
<script type="module" src="src/app.js"></script>
</body>
</html>
