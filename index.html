<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mol-craft — 무료 분자 조립·응력 분석</title>
<script>
  // 첫 페인트 전에 저장된 테마를 적용한다 — body 하단 스크립트까지 기다리면
  // 시스템은 라이트인데 사용자가 다크를 저장한 경우 한 프레임 라이트로
  // 그려졌다 다크로 바뀌는 깜빡임(FOUC)이 생긴다.
  (() => {
    const saved = localStorage.getItem('mol-craft-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  })();
</script>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    /* Apple "liquid glass" palette. Chrome floats as translucent, blurred
       modules (Control Center / Dock style) over a vivid, blurred wallpaper
       gradient — the color bleed-through under blur+saturate is what makes
       glass read as glass, so the ground can't be flat grey. */
    --bg: #eef1f8;
    --wallpaper:
      radial-gradient(1100px 760px at 12% -8%, rgba(96, 165, 250, 0.55), transparent 60%),
      radial-gradient(950px 700px at 88% 4%, rgba(167, 139, 250, 0.5), transparent 58%),
      radial-gradient(1000px 820px at 46% 112%, rgba(45, 212, 191, 0.4), transparent 62%),
      linear-gradient(160deg, #eef2ff 0%, #f5f5f7 45%, #e0f2fe 100%);
    --surface: #ffffff;
    --panel: #ffffff;
    --fg: #1d1d1f;
    --muted-fg: #6e6e73;
    --border: rgba(0, 0, 0, 0.08);
    --primary: #0071e3;
    --primary-fg: #ffffff;
    --accent: #ff9f0a;
    --danger: #ff3b30;
    --success: #30d158;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-bg-strong: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.65);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.75);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0, 0, 0, 0.03);
    --shadow-md: 0 10px 30px rgba(30, 41, 59, 0.14), 0 2px 8px rgba(30, 41, 59, 0.06);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  /* 다크 토큰. 시스템이 다크인데 사용자가 명시적으로 라이트를 고른 경우는
     제외하고(:not([data-theme="light"])), 시스템과 무관하게 사용자가 다크를
     고른 경우는 [data-theme="dark"]로 항상 덮어쓴다 — 토글 버튼이 시스템
     설정보다 우선한다. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #05070d;
      --wallpaper:
        radial-gradient(1100px 760px at 12% -8%, rgba(59, 92, 190, 0.55), transparent 62%),
        radial-gradient(950px 700px at 88% 6%, rgba(124, 58, 237, 0.45), transparent 58%),
        radial-gradient(1000px 820px at 46% 112%, rgba(13, 148, 136, 0.4), transparent 62%),
        linear-gradient(160deg, #05070d 0%, #0a0e1a 45%, #05070d 100%);
      --surface: #1c1c1e;
      --panel: #1c1c1e;
      --fg: #f5f5f7;
      --muted-fg: #98989d;
      --border: rgba(255, 255, 255, 0.09);
      --primary: #2997ff;
      --primary-fg: #ffffff;
      --accent: #ff9f0a;
      --danger: #ff453a;
      --success: #32d74b;
      --glass-bg: rgba(28, 28, 30, 0.55);
      --glass-bg-strong: rgba(28, 28, 30, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 10px 32px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #05070d;
    --wallpaper:
      radial-gradient(1100px 760px at 12% -8%, rgba(59, 92, 190, 0.55), transparent 62%),
      radial-gradient(950px 700px at 88% 6%, rgba(124, 58, 237, 0.45), transparent 58%),
      radial-gradient(1000px 820px at 46% 112%, rgba(13, 148, 136, 0.4), transparent 62%),
      linear-gradient(160deg, #05070d 0%, #0a0e1a 45%, #05070d 100%);
    --surface: #1c1c1e;
    --panel: #1c1c1e;
    --fg: #f5f5f7;
    --muted-fg: #98989d;
    --border: rgba(255, 255, 255, 0.09);
    --primary: #2997ff;
    --primary-fg: #ffffff;
    --accent: #ff9f0a;
    --danger: #ff453a;
    --success: #32d74b;
    --glass-bg: rgba(28, 28, 30, 0.55);
    --glass-bg-strong: rgba(28, 28, 30, 0.72);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 10px 32px rgba(0, 0, 0, 0.6);
  }
  :root[data-theme] { color-scheme: only light; }
  :root[data-theme="dark"] { color-scheme: only dark; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font: 14px/1.5 var(--font-sans);
    /* app.js reads getComputedStyle(body).backgroundColor to seed the 3Dmol
       canvas clear color, so a plain background-color must stay set
       alongside the decorative wallpaper gradient (an image layer, which
       doesn't populate that longhand). */
    background-color: var(--surface);
    background-image: var(--wallpaper);
    background-attachment: fixed;
    color: var(--fg);
    display: grid;
    grid-template-columns: 1fr 348px;
    grid-template-rows: auto auto auto 1fr;
    gap: 10px;
    padding: 10px;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header, #toolbar {
    grid-column: 1 / -1;
    padding: 11px 18px;
    border-radius: 18px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--shadow-sm), var(--glass-highlight);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  /* backdrop-filter는 header에 별도 스태킹 컨텍스트를 만들지만, header 자체는
     position이 없어 "안 떠 있는(static)" 형제로 취급된다 — 그러면 DOM에서
     뒤에 오는 형제(#toolbar, #viewer, aside 등, 전부 static)가 나중에 칠해져
     header 안의 드롭다운 목록(.dropdown-list, position:absolute)이 밑으로
     깔려버린다. header를 양수 z-index로 띄워서 형제들 위에서 항상 그려지게
     한다 — 드롭다운이 header 밖으로 넘쳐도 이 규칙 하나로 해결된다. */
  header { position: relative; z-index: 5; }
  header strong {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--fg);
    margin-right: 6px;
  }
  #disclaimer {
    font-size: 11.5px;
    color: var(--muted-fg);
    margin-left: auto;
    max-width: 42ch;
    text-align: right;
    letter-spacing: -0.005em;
  }
  /* 라이트/다크 전환 — 상단 우측 모서리의 원형 아이콘 버튼. 두 아이콘을
     겹쳐 두고 opacity+rotate로 크로스페이드한다(레이아웃 흔들림 없이). */
  #theme-toggle {
    position: relative;
    flex-shrink: 0;
    width: 34px; height: 34px;
    padding: 0;
    border-radius: 50%;
    color: var(--fg);
  }
  #theme-toggle svg {
    position: absolute; inset: 0; margin: auto;
    width: 18px; height: 18px;
    transition: opacity .25s ease, transform .35s ease;
  }
  #theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
  #theme-toggle .icon-moon { opacity: 0; transform: rotate(-60deg) scale(.6); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #theme-toggle .icon-sun { opacity: 0; transform: rotate(60deg) scale(.6); }
    :root:not([data-theme="light"]) #theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  }
  :root[data-theme="dark"] #theme-toggle .icon-sun { opacity: 0; transform: rotate(60deg) scale(.6); }
  :root[data-theme="dark"] #theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg) scale(1); }
  #viewer {
    position: relative;
    min-height: 0;
    background: var(--surface);
    border-radius: 22px;
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  /* 3Dmol이 뷰어 캔버스를 position:absolute; z-index:0으로 붙이는데, 우리 HTML
     오버레이(토스트·HUD·범례·박스선택·경고 글로우)는 z-index를 안 줘서 auto였다 —
     그러면 DOM 순서상 캔버스가 나중에 붙어(3Dmol이 정적 마크업보다 늦게 삽입) 전부
     가려진다. 실제로 스크린샷을 찍어보면 텍스트·색이 하나도 안 보였다(DOM엔 있는데
     화면엔 없는 상태 — textContent로만 확인하면 못 잡는다). 캔버스보다 위로 올린다.
     #sketch2d는 그 위에 또 덮여야 하므로 기존 z-index:5를 그대로 둔다(아래 목록에
     안 넣는다 — 넣으면 ID 선택자끼리라도 이 규칙이 :not() 때문에 특이도가 더 높아져
     5를 1로 깎아버린다). */
  #legend, #toast, #stability, #boxselect, #warnlayer { z-index: 1; }
  #legend {
    position: absolute;
    left: 16px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted-fg);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 5px 12px;
    box-shadow: var(--shadow-sm);
    pointer-events: none;
  }
  #legend .bar {
    width: 72px;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(90deg, #2166ac, #f7f7f7, #b2182b);
  }
  aside {
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--shadow-md), var(--glass-highlight);
    overflow-y: auto;
    padding: 8px 20px;
  }
  section {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  section:last-child { border-bottom: none; }
  h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted-fg);
    margin: 0 0 10px;
    font-weight: 600;
  }
  #total { font: 600 28px/1.2 var(--font-mono); letter-spacing: -0.01em; }
  .bar { height: 14px; background: var(--primary); border-radius: 2px; }
  #toast {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    color: var(--fg);
    padding: 8px 18px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-md);
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #warn { color: var(--accent); font-size: 12px; margin-top: 4px; }
  button, select {
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    border: 1px solid var(--glass-border);
    border-radius: 980px;
    padding: 6px 14px;
    cursor: pointer;
    box-shadow: var(--glass-highlight);
    transition: background-color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  button:hover, select:hover { background: color-mix(in srgb, var(--surface) 96%, transparent); box-shadow: var(--shadow-sm), var(--glass-highlight); }
  button:active { transform: scale(0.97); }
  button:focus-visible, select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  /* 커스텀 드롭다운 — 열렸을 때 OS 기본 사각 팝업 대신 우리 유리 패널이
     뜨도록 실제 <select>는 숨은 상태값으로만 쓰고 트리거 버튼 + 목록을
     새로 그린다(app.js의 enhanceSelect). appearance: base-select는 이
     글을 쓰는 시점 기준으로 아직 실제 배포 브라우저 대부분에서 동작하지
     않아(런타임 미지원, CSS.supports만 통과) 신뢰할 수 없었다. */
  select.dropdown-native { display: none; }
  .dropdown { position: relative; display: inline-flex; }
  .dropdown-trigger {
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .dropdown-trigger .chev {
    width: 10px; height: 10px; flex-shrink: 0;
    transition: transform .2s ease;
  }
  .dropdown-trigger[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .dropdown-list {
    list-style: none; margin: 0; padding: 6px;
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    min-width: 100%; max-height: 260px; overflow-y: auto;
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--shadow-md), var(--glass-highlight);
  }
  .dropdown-option {
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--fg);
    white-space: nowrap;
    cursor: pointer;
  }
  .dropdown-option:hover,
  .dropdown-option:focus-visible {
    background: color-mix(in srgb, var(--primary) 16%, transparent);
    outline: none;
  }
  .dropdown-option[aria-selected="true"] {
    background: var(--primary);
    color: var(--primary-fg);
  }
  input[type="range"] { accent-color: var(--primary); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; }
  td { padding: 3px 0; } td:last-child { text-align: right; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 55vh 1fr; }
    #disclaimer { max-width: none; text-align: left; margin-left: 0; }
  }
  #sketch2d {
    position: absolute; inset: 0; z-index: 5;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  /* ID 선택자(display:flex)가 브라우저 기본 [hidden]{display:none}보다 우선순위가 높아서
     hidden 속성이 아무 효과가 없었다 — #sketch2d가 항상 3D 뷰어를 불투명하게 덮고 있던
     원인. hidden일 때만 명시적으로 꺼서 우선순위를 되돌린다. */
  #sketch2d[hidden] { display: none; }
  #sketch2d svg { max-width: 92%; max-height: 92%; }
  body[data-flat="true"] #legend, body[data-flat="true"] #stability { display: none; }
  body:not([data-colorby="strain"]) #legend { display: none; }
  #stability {
    position: absolute; top: 16px; left: 16px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 60%;
    font-size: 11px; background: var(--glass-bg-strong);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: 14px; padding: 7px 11px;
    box-shadow: var(--shadow-sm), var(--glass-highlight);
    pointer-events: none;
  }
  .chip {
    border-radius: 10px; padding: 2px 7px; white-space: nowrap;
    background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--muted-fg);
  }
  .chip.warn { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .chip.danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  label.check { font-size: 12px; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; }
  #tools, #palette {
    display: flex; gap: 2px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--fg) 6%, transparent);
    border: 1px solid var(--border); border-radius: 12px; padding: 2px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  #tools button, #palette button {
    border: none; border-radius: 10px; background: transparent; box-shadow: none;
  }
  #palette button { min-width: 32px; font-family: var(--font-mono); font-weight: 600; }
  button.tool.active, #palette button.active {
    background: var(--primary); color: var(--primary-fg);
    box-shadow:
      var(--shadow-sm),
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      0 0 0 2px color-mix(in srgb, var(--primary) 45%, transparent),
      0 0 10px 0 color-mix(in srgb, var(--primary) 35%, transparent);
    animation: tool-glow 2.4s ease-in-out infinite;
  }
  @keyframes tool-glow {
    50% {
      box-shadow:
        var(--shadow-sm),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 0 0 4px color-mix(in srgb, var(--primary) 55%, transparent),
        0 0 18px 2px color-mix(in srgb, var(--primary) 60%, transparent);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    button.tool.active, #palette button.active { animation: none; }
  }
  #toolbar-sep { width: 1px; align-self: stretch; background: var(--border); }
  /* 현재 도구가 무슨 일을 하는지 항상 한 줄로 보여준다 — 예전엔 툴팁에만 있어서
     '결합' 도구가 원자 잇기와 차수 바꾸기를 겸한다는 걸 알 방법이 없었다. */
  #toolhint {
    grid-column: 1 / -1;
    padding: 6px 20px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow: var(--shadow-sm), var(--glass-highlight);
    font-size: 12px;
    color: var(--muted-fg);
    min-height: 26px;
    letter-spacing: -0.005em;
  }
  #toolhint b { color: var(--fg); font-weight: 600; }
  #boxselect {
    position: absolute; display: none; pointer-events: none;
    border: 1px dashed var(--primary);
    background: color-mix(in srgb, var(--primary) 15%, transparent);
  }
  /* 경고 하이라이트. 3D 반투명 구로 만들었더니 3Dmol 조명이 색을 씻어내
     회백색 얼룩(측정값 rgb(245,246,246))이 됐고, P·S처럼 CPK 색이 주황·노랑인
     원소에서는 신호와 원소색이 구분되지 않았다. 화면 위에 얹는 CSS 글로우는
     조명과 무관하고 색을 그대로 유지한다. */
  #warnlayer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .warnglow {
    position: absolute;
    width: 58px; height: 58px;
    margin: -29px 0 0 -29px;      /* 중심 정렬 — transform은 안 쓴다(매 프레임 갱신이라 left/top이 싸다) */
    border-radius: 50%;
    animation: glowpulse 2.2s ease-in-out infinite;
  }
  .warnglow.warn   { background: radial-gradient(circle, rgba(245,158,11,.55) 0%, rgba(245,158,11,.18) 45%, transparent 70%); }
  .warnglow.danger { background: radial-gradient(circle, rgba(220,38,38,.60) 0%, rgba(220,38,38,.20) 45%, transparent 70%); }
  @keyframes glowpulse { 50% { opacity: .45; } }
  body[data-flat="true"] #warnlayer { display: none; }
  #mission .mission-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  #mission .mission-item, #mission .mission-choice { text-align: left; width: 100%; }
  #mission .mission-choice.active { outline: 2px solid var(--accent, #4a9eff); }
  #mission .mission-meta { font-size: 12px; opacity: 0.7; }
  #mission .mission-brief { font-size: 13px; line-height: 1.5; }
  #mission .mission-choices { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
  #mission .mission-probe { margin-top: 8px; font-size: 13px; }
  #mission .mission-trust, #trust-badge { font-size: 11px; opacity: 0.85; line-height: 1.4; }
  #mission .mission-ok { color: #2e9e5b; font-size: 13px; margin-top: 8px; }
  #mission .mission-bad { color: #d1603d; font-size: 13px; margin-top: 8px; }
  #mission .mission-hint-text { font-size: 12px; opacity: 0.9; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <strong>mol-craft</strong>
  <select id="preset"></select>
  <select id="colorby" title="원자 색을 무엇으로 칠할지">
    <option value="element">원소 색</option>
    <option value="strain">응력 히트맵</option>
  </select>
  <button id="minimize">구조 최적화</button>
  <button id="export-xyz">XYZ</button>
  <button id="export-mol">MOL</button>
  <button id="export-pdb">PDB</button>
  <button id="share">링크 복사</button>
  <button id="share-short">단축 링크</button>
  <span id="disclaimer">UFF 역장 · 진공 · 정전기항 제외 · 정성 비교용(양자계산 대체 아님)</span>
  <button id="theme-toggle" title="다크모드 전환" aria-pressed="false">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2z"/></svg>
  </button>
</header>
<div id="toolbar">
  <div id="tools">
    <button id="tool-view" class="tool active" data-tool="view" title="보기: 클릭해도 아무것도 바뀌지 않습니다 — 드래그로 카메라만 돌립니다">보기</button>
    <button id="tool-select" class="tool" data-tool="select" title="선택: 클릭·Shift+클릭·드래그로 여러 개">선택</button>
    <button id="tool-erase" class="tool" data-tool="erase" title="지우개: 클릭한 원자 삭제">지우개</button>
    <button id="tool-bond" class="tool" data-tool="bond" title="원자 두 개를 순서대로 클릭하면 잇고, 결합선을 클릭하면 차수가 바뀝니다">결합·차수</button>
    <button id="tool-ring-benzene" class="tool" data-tool="ring" data-ring="benzene" title="열린 자리에 벤젠 고리를 붙입니다">고리(벤젠)</button>
    <button id="tool-ring-cyclohexane" class="tool" data-tool="ring" data-ring="cyclohexane" title="열린 자리에 사이클로헥산 고리를 붙입니다">고리(사이클로헥산)</button>
  </div>
  <div id="toolbar-sep"></div>
  <div id="palette" title="원소를 고르면 붙이기 도구로 전환됩니다 (숫자키 1~9)"></div>
  <div id="toolbar-sep"></div>
  <button id="undo" title="실행취소 (Ctrl+Z)">↶ 실행취소</button>
  <button id="duplicate" title="선택 복제 (Ctrl+D)">복제</button>
  <button id="fill-h" title="빈 원자가를 수소로 채웁니다 (되돌리기 가능)">수소 채우기</button>
  <button id="view2d" aria-pressed="false" title="골격 구조식(스켈레탈 포뮬러) 보기 전환">2D 보기</button>
</div>
<div id="toolhint"></div>
<div id="viewer">
  <div id="toast"></div>
  <div id="stability"></div>
  <div id="boxselect"></div>
  <div id="warnlayer"></div>
  <div id="legend"><span>응력 낮음</span><span class="bar"></span><span>응력 높음</span></div>
  <div id="sketch2d" hidden></div>
</div>
<aside>
  <section id="mission"></section>
  <section><h2>총 에너지</h2><div id="total">—</div><div id="warn"></div><div id="trust-badge"></div></section>
  <section><h2>항별 분해 (kcal/mol)</h2><div id="breakdown"></div></section>
  <section><h2>선택 측정</h2><div id="measure">원자를 2~4개 클릭</div></section>
  <section><h2>이면각 회전</h2>
    <input id="dihedral" type="range" min="-180" max="180" value="0" style="width:100%" disabled>
    <div id="dihedral-info" style="font-size:12px">원자 4개를 순서대로 선택하면 활성화됩니다</div>
  </section>
  <section><h2>최적화 리플레이</h2>
    <input id="replay" type="range" min="0" max="0" value="0" style="width:100%" disabled>
    <div id="replay-info" style="font-size:12px">구조 최적화를 실행하면 활성화됩니다</div>
  </section>
  <section><h2>VSEPR 상태</h2><div id="vsepr">—</div></section>
  <section id="gallery-section" hidden><h2>공개 갤러리</h2><div id="gallery">불러오는 중…</div></section>
</aside>
<script>
  // 테마 토글. 저장된 선택이 없으면 시스템 설정을 그대로 따르고(root에
  // data-theme을 안 둠 — CSS의 prefers-color-scheme이 계속 실시간 반영),
  // 사용자가 한 번 고르면 그 이후로는 시스템이 바뀌어도 선택이 우선한다.
  (() => {
    const root = document.documentElement;
    const btn = document.getElementById('theme-toggle');
    const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
    const resolved = () => root.dataset.theme || (systemDark() ? 'dark' : 'light');
    const sync = () => btn.setAttribute('aria-pressed', String(resolved() === 'dark'));
    btn.addEventListener('click', () => {
      const next = resolved() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('mol-craft-theme', next);
      sync();
      document.dispatchEvent(new CustomEvent('mol-craft-theme-change'));
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!root.dataset.theme) { sync(); document.dispatchEvent(new CustomEvent('mol-craft-theme-change')); }
    });
    sync();
  })();
</script>
<script type="module" src="src/app.js"></script>
</body>
</html>
